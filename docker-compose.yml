version: '3.8'

services:
  # ── Producer Studio Application ──
  sports-producer-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sports-producer-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data/SoccerNet:ro
      - ./output:/output
    environment:
      - NEMOTRON_URL=http://nemotron-lightning:8000/v1
      - NEMOTRON_MODEL=nemotron-3.5-lightning
      - VSS_URL=http://vss-engine:8010
      - VSS_ENABLED=false
      - DATA_DIR=/data/SoccerNet
      - OUTPUT_DIR=/output
      - MATCH_SPEED_MULTIPLIER=6.0
    depends_on:
      - nemotron-lightning
    networks:
      - sports-network

  # ── NVIDIA Nemotron 3.5 Lightning NIM (30B-A3B MoE) ──
  nemotron-lightning:
    image: nvcr.io/nim/nvidia/nemotron-3.5-lightning-30b-a3b:latest
    container_name: nemotron-lightning
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NGC_API_KEY=${NGC_API_KEY}
    volumes:
      - ~/.cache/nim:/opt/nim/.cache
    shm_size: 16gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - sports-network

networks:
  sports-network:
    driver: bridge
